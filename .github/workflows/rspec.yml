name: RSpec Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: my_app_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - "4444:4444"
        options: >-
          --shm-size=2g

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
          bundler-cache: true

      - name: Database setup
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:password@localhost:5432/my_app_test
        run: |
          bin/rails db:create
          bin/rails db:migrate

      - name: Run RSpec tests 
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:password@localhost:5432/my_app_test
        run: bundle exec rspec
